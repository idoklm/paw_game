<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #8FE0F2, #2FA9C8 70%); }
  .round .bg { border-radius: 112px; }
  .face { position: absolute; left: 50%; top: 0; width: 560px; transform: translateX(-50%); }
  .mask .face { width: 440px; top: 40px; }
</style></head>
<body><div class="bg"></div><img class="face" id="f" alt="">
<script>
  // Dev page used to render the app icons from the Pilpel sprite: ?mask for the maskable version.
  const q = new URLSearchParams(location.search);
  document.body.className = q.has('mask') ? 'mask' : 'round';
  document.getElementById('f').src = `../assets/sprites/pup-${q.get('pup') || 'pilpel'}.webp`;
</script></body></html>
