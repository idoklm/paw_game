<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<link rel="stylesheet" href="../css/art.css">
<style>
  * { animation: none !important; }
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #8FE0F2, #2FA9C8 70%); }
  .round .bg { border-radius: 112px; }
  .head { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 470px; }
  .mask .head { width: 360px; }
</style></head>
<body><div class="bg"></div><div class="head" id="h"></div>
<script type="module">
  // Dev page used by tools to render app icons: ?mask for the maskable version.
  import { puppySVG } from '../js/art/puppies.js';
  const q = new URLSearchParams(location.search);
  document.body.className = q.has('mask') ? 'mask' : 'round';
  document.getElementById('h').innerHTML = puppySVG(q.get('pup') || 'pilpel', { headOnly: true });
</script></body></html>
