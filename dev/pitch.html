<!doctype html>
<html><head><meta charset="utf-8"><title>pitch</title></head>
<body>
<script>
  // Dev tool: window.measure(urls) returns the median speaking pitch (F0, Hz) of each audio file.
  // Method: YIN difference function on 2048-sample frames, voiced frames only.
  // Rough ranges: adult man 85-155 Hz, adult woman 165-255 Hz, child 250-400 Hz.
  const ctx = new OfflineAudioContext(1, 1, 24000);

  function yin(buf, sr, fmin = 70, fmax = 700, threshold = 0.15) {
    const minLag = Math.floor(sr / fmax), maxLag = Math.floor(sr / fmin);
    const n = buf.length - maxLag;
    const d = new Float32Array(maxLag + 1);
    for (let lag = 1; lag <= maxLag; lag++) {
      let s = 0;
      for (let i = 0; i < n; i++) { const x = buf[i] - buf[i + lag]; s += x * x; }
      d[lag] = s;
    }
    let run = 0;
    for (let lag = 1; lag <= maxLag; lag++) { run += d[lag]; d[lag] = run ? (d[lag] * lag) / run : 1; }
    for (let lag = minLag; lag < maxLag; lag++) {
      if (d[lag] < threshold) {
        while (lag + 1 < maxLag && d[lag + 1] < d[lag]) lag++;
        const a = d[lag - 1], b = d[lag], c = d[lag + 1];
        const shift = (a - c) / (2 * (a - 2 * b + c)) || 0;
        return sr / (lag + shift);
      }
    }
    return 0;
  }

  const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.floor(arr.length * p))];

  function measureBuffer(audio) {
      const x = audio.getChannelData(0), sr = audio.sampleRate;
      const frame = 2048, hop = 1024, f0 = [];
      let peak = 0;
      for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
      for (let i = 0; i + frame < x.length; i += hop) {
        const buf = x.subarray(i, i + frame);
        let rms = 0;
        for (let j = 0; j < frame; j++) rms += buf[j] * buf[j];
        rms = Math.sqrt(rms / frame);
        if (rms < peak * 0.08) continue; // skip silence
        const f = yin(buf, sr);
        if (f) f0.push(f);
      }
      f0.sort((a, b) => a - b);
      return f0.length ? { median: Math.round(pct(f0, 0.5)), p20: Math.round(pct(f0, 0.2)), p80: Math.round(pct(f0, 0.8)), frames: f0.length, secs: +(x.length / sr).toFixed(1) } : null;
  }

  window.measure = async (urls) => {
    const out = {};
    for (const url of urls) out[url] = measureBuffer(await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer()));
    return out;
  };

  function encodeWav(samples, sr) {
    const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 0x7fff, true);
    return new Blob([buf], { type: 'audio/wav' });
  }

  window.download = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
  };

  // Plays `src` faster by `factor` with the pitch not preserved (same as the game does), measures it, and saves a WAV.
  window.processItem = async (src, factor, name) => {
    const base = await ctx.decodeAudioData(await (await fetch(src)).arrayBuffer());
    const off = new OfflineAudioContext(1, Math.ceil(base.length / factor), base.sampleRate);
    const node = off.createBufferSource();
    node.buffer = base;
    node.playbackRate.value = factor;
    node.connect(off.destination);
    node.start();
    const out = await off.startRendering();
    const pitch = measureBuffer(out);
    window.download(encodeWav(out.getChannelData(0), out.sampleRate), name);
    return pitch;
  };
</script>
</body></html>
